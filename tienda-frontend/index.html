<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Steren (NoSQL)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        h1 { text-align: center; color: #333; }
        #catalogo { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .tarjeta-producto { background: white; border-radius: 8px; padding: 15px; width: 250px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .tarjeta-producto img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 4px; }
        .precio { color: #28a745; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Catálogo de Productos</h1>
    
    <!-- Aquí se insertarán los productos desde JavaScript -->
    <div id="catalogo"></div>

    <script src="app.js"></script>
</body>
</html>
